<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculate Costs - Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../home/index.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="../../components/stocks/index.css" />
    <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>

<body class="bg-gray-100">
    <div class="flex w-full min-h-screen">
        <aside class="sidebar">
            <h2 class="logo">Calculate Costs $</h2>
            <p class="nav-link accordion">Global Stocks</p>
            <div class="accordion-content" id="global-stocks-container">
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <nav class="top-nav">
                    <a href="/pages/home/index.html" class="top-link">Home</a>
                    <a href="/pages/expense/index.html" class="top-link">Add Expense</a>
                    <a href="/pages/income/index.html" class="top-link">Add Income</a>
                    <a href="/pages/wallet/index.html" id="wallet-link" class="top-link">Wallet</a>
                    <a href="/pages/transactions/index.html" id="wallet-link" class="top-link">Transactions</a>
                </nav>
                <div class="user-info">
                    <a id="logout-tag">Logout</a>
                </div>
            </header>
            <main class="flex-1 p-2 md:p-8 overflow-y-auto">
                <div class="">
                    <h1 class="text-3xl font-bold text-gray-800">Welcome to your transactions!</h1>
                    <p class="text-gray-500 mt-1 mb-6">Here's a summary of all your transactions.</p>

                    <div class="mt-6 bg-white p-6 rounded-xl shadow-md">
                        <h3 class="font-bold text-lg text-gray-700 mb-4">Recent Transactions</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="border-b-2 border-gray-200">
                                        <th class="p-3 text-sm font-semibold text-gray-500">Description</th>
                                        <th class="p-3 text-sm font-semibold text-gray-500">Date</th>
                                        <th class="p-3 text-sm font-semibold text-gray-500 text-right">Amount</th>
                                        <th class="p-3 text-sm font-semibold text-gray-500 text-center">Type</th>
                                        <th class="p-3 text-sm font-semibold text-gray-500 text-center">Category</th>
                                        <th class="p-3 text-sm font-semibold text-gray-500 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-page-table-body">
                                    <!-- Rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
            </main>
        </div>
    </div>


</body>
<script src="./index.js"></script>
<script src="/components/logout/index.js"></script>
<script src="/components/stocks/index.js"></script>

</html>
