<body>
    <div class="container">
        <aside class="sidebar">
            <h2 class="logo">Calculate Costs $</h2>
            <nav class="nav-menu">
                <p href="#" class="nav-link active">My Stocks</p>
                <p class="nav-link accordion">Global Stocks</p>
                <div class="accordion-content-form" id="global-stocks-container">
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <nav class="top-nav">
                    <a href="/pages/home/index.html" class="top-link">Home</a>
                    <a href="/pages/expense/index.html" class="top-link">Add Expense -</a>
                    <a href="/pages/income/index.html" class="top-link">Add Income +</a>
                    <a href="#" id="wallet-link" class="top-link">Wallet</a>
                </nav>
                <div class="user-info">Hello, User</div>
            </header>

            <main class="dashboard">
                <h1>Income page</h1>
                <form class="income-form" id="income-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" placeholder="Desciption of the income" required />
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" placeholder="Enter amount" required />
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required />
                      </div>

                    <div class="form-group">
                        <label for="income-currency">Currency</label>
                        <select name="income-currency" id="income-currency">
                            <option>BRL</option>
                            <option>USD</option>
                            <option>EUR</option>
                            <option>CNY</option>
                        </select>

                    </div>
                    <div class="div-btn">
                        <button type="submit" class="cancel-btn">Clear</button>
                        <button type="submit" class="submit-btn">Add Income</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</body>
