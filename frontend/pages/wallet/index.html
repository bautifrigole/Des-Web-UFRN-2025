<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculate Costs - Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../home/index.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="../../components/stocks/index.css" />
</head>

<body class="bg-gray-100">
    <div class="container">
        <aside class="sidebar">
            <h2 class="logo">Calculate Costs $</h2>
            <p class="nav-link accordion">Global Stocks</p>
            <div class="accordion-content" id="global-stocks-container">
            </div>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <nav class="top-nav">
                    <a href="/pages/home/index.html" class="top-link">Home</a>
                    <a href="/pages/expense/index.html" class="top-link">Add Expense</a>
                    <a href="/pages/income/index.html" class="top-link">Add Income</a>
                    <a href="/pages/wallet/index.html" id="wallet-link" class="top-link">Wallet</a>
                </nav>
                <div class="user-info">
                    <a id="logout-tag">Logout</a>
                </div>
            </header>
            <main class="flex-1 p-2 md:p-8 overflow-y-auto">
                <div class="">
                    <h1 class="text-3xl font-bold text-gray-800">Welcome to your wallet!</h1>
                    <p class="text-gray-500 mt-1 mb-6">Here's a summary of your Stock profit.</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-md flex items-center space-x-4">
                            <div class="bg-green-100 p-3 rounded-full">
                                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v.01">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Total amount</p>
                                <p id="total-amount" class="text-2xl font-bold text-gray-800">$0.00</p>
                            </div>
                        </div>


                        <div class="bg-white p-6 rounded-xl shadow-md flex items-center space-x-4">
                            <div class="bg-purple-100 p-3 rounded-full">
                                <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Total Invested</p>
                                <p id="total-invested" class="text-2xl font-bold text-gray-800">$0.00</p>
                            </div>
                        </div>


                        <div class="bg-white p-6 rounded-xl shadow-md flex items-center space-x-4">
                            <div class="bg-blue-100 p-3 rounded-full">
                                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Balance</p>
                                <p id="total-balance" class="text-2xl font-bold text-gray-800">$0.00</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-md flex items-center space-x-4">
                            <div class="bg-indigo-100 p-3 rounded-full">
                                <svg class="w-6 h-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500">Stocks</p>
                                <p id="total-stocks" class="text-2xl font-bold text-gray-800">0</p>
                            </div>
                        </div>


                    </div>

                    <!-- Charts Grid -->
                    <div class="chart-container">
                        <select id="period-select" name="period">
                            <option value="1M">1M</option>
                            <option value="3M">3M</option>
                            <option value="6M">6M</option>
                            <option value="1Y" selected>1Y</option>
                        </select>
                        <canvas id="stockChart"></canvas>
                    </div>
            </main>
        </div>
    </div>
    <script src="/pages/home/index.js"></script>
    <script src="/components/stocks/index.js"></script>
    <script src="../../components/stocks/index.js"></script>

</body>

</html>
